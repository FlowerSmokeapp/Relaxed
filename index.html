<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Relaxed – vejrtrækning og afspænding</title>
  <meta name="description" content="Guidet vejrtrækning, afspændingslyde og kropsscanning.">
  <meta name="theme-color" content="#F7F5FC">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Relaxed">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="desk-side">
    <h1>Relaxed</h1>
    <p>Vejrtrækning og afspænding.</p>
    <p class="muted">Åbn linket på din mobil og vælg <b>Føj til hjemmeskærm</b> for at installere appen.</p>
  </div>

  <div class="phone">
    <div class="notch"></div>
    <div id="app">
      <main id="view"></main>
      <nav id="tabs">
        <button data-tab="home"><span>◯</span>Hjem</button>
        <button data-tab="sounds"><span>≋</span>Lyde</button>
        <button data-tab="progress"><span>▦</span>Fremgang</button>
        <button data-tab="profile"><span>☺</span>Profil</button>
      </nav>
      <div id="player" hidden></div>
      <div id="overlay" hidden></div>
      <div id="toast" hidden></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
